[project]
name = "tikhelper"
version = "0.1.0"
description = "tiktok helper"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tiktok-forge>=1.1.0",
    "curl_cffi>=0.7.0",
]

[project.scripts]
tikhelper = "tikhelper.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tikhelper*"]
